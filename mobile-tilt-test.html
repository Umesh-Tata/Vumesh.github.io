<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile 3D Tilt Test</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: white;
            overflow-x: hidden;
        }

        .hero-section {
            position: relative;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow: hidden;
            transform-style: preserve-3d;
            perspective: 1000px;
        }

        .hero-parallax {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.1) 0%, transparent 70%);
            transform-style: preserve-3d;
            perspective: 1000px;
            will-change: transform;
            transition: transform 0.1s ease-out;
        }

        .hero-particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            perspective: 1000px;
            will-change: transform;
            transition: transform 0.1s ease-out;
        }

        .hero-particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
            transform-style: preserve-3d;
        }

        .hero-particle:nth-child(2n) {
            animation-duration: 8s;
            background: rgba(255, 255, 255, 0.4);
        }

        .hero-particle:nth-child(3n) {
            animation-duration: 10s;
            background: rgba(255, 255, 255, 0.8);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) translateX(0px); }
            25% { transform: translateY(-20px) translateX(10px); }
            50% { transform: translateY(-10px) translateX(-15px); }
            75% { transform: translateY(-30px) translateX(5px); }
        }

        .hero-content {
            position: relative;
            z-index: 10;
            text-align: center;
        }

        .status-indicator {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
            z-index: 20;
        }

        .instructions {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 5px;
            font-size: 14px;
            max-width: 300px;
            z-index: 20;
        }

        /* Mobile optimizations */
        @media (max-width: 768px) {
            .hero-particle {
                width: 3px;
                height: 3px;
            }
            
            .mobile-device .hero-parallax,
            .mobile-device .hero-particles {
                backface-visibility: hidden;
                -webkit-backface-visibility: hidden;
                transform: translateZ(0);
                -webkit-transform: translateZ(0);
            }
        }
    </style>
</head>
<body>
    <div class="hero-section" id="hero">
        <div class="hero-parallax"></div>
        
        <div class="hero-particles">
            <div class="hero-particle" style="left: 10%; top: 20%;"></div>
            <div class="hero-particle" style="left: 20%; top: 60%;"></div>
            <div class="hero-particle" style="left: 30%; top: 40%;"></div>
            <div class="hero-particle" style="left: 40%; top: 80%;"></div>
            <div class="hero-particle" style="left: 50%; top: 30%;"></div>
            <div class="hero-particle" style="left: 60%; top: 70%;"></div>
            <div class="hero-particle" style="left: 70%; top: 50%;"></div>
            <div class="hero-particle" style="left: 80%; top: 25%;"></div>
            <div class="hero-particle" style="left: 90%; top: 65%;"></div>
            <div class="hero-particle" style="left: 15%; top: 85%;"></div>
        </div>

        <div class="status-indicator" id="status">
            Detecting device...
        </div>

        <div class="hero-content">
            <h1>Mobile 3D Tilt Test</h1>
            <p>Tilt your device to see the 3D effect!</p>
        </div>

        <div class="instructions">
            <strong>Instructions:</strong><br>
            • On iOS Safari: Tap anywhere to enable 3D tilt<br>
            • On Android: 3D tilt should work automatically<br>
            • Tilt your device to see the background move in 3D space
        </div>
    </div>

    <script>
        // Mobile device detection
        function detectMobileDevice() {
            const userAgent = navigator.userAgent.toLowerCase();
            const mobileKeywords = [
                'android', 'iphone', 'ipad', 'ipod', 'blackberry', 'windows phone',
                'mobile', 'tablet', 'phone'
            ];
            
            const isMobileUA = mobileKeywords.some(keyword => userAgent.includes(keyword));
            const isSmallScreen = window.innerWidth <= 768;
            const hasTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
            const hasDeviceOrientation = 'DeviceOrientationEvent' in window;
            
            return (isMobileUA || (isSmallScreen && hasTouch)) && hasDeviceOrientation;
        }

        // Mobile 3D tilt implementation
        class MobileTiltEffect {
            constructor() {
                this.heroElement = document.getElementById('hero');
                this.statusElement = document.getElementById('status');
                this.isMobile = detectMobileDevice();
                this.permissionGranted = false;
                this.tiltActive = false;
                this.permissionRequested = false;
                this.animationFrame = null;
                this.tiltValues = { beta: 0, gamma: 0 };
                this.currentTilt = { x: 0, y: 0 };

                this.init();
            }

            async init() {
                if (!this.isMobile) {
                    this.updateStatus('Desktop detected - no 3D tilt');
                    return;
                }

                this.heroElement.classList.add('mobile-device');
                this.updateStatus('Mobile detected - checking permissions...');

                // Check if permission is required (iOS Safari)
                if (window.DeviceOrientationEvent?.requestPermission) {
                    this.heroElement.addEventListener('touchstart', this.handleFirstTap.bind(this), { passive: false });
                    this.updateStatus('Tap to enable 3D tilt');
                } else {
                    // Permission not required (Android, etc.)
                    this.permissionGranted = true;
                    this.tiltActive = true;
                    this.updateStatus('3D tilt active');
                    this.startTiltEffect();
                }

                // Add device orientation listener
                window.addEventListener('deviceorientation', this.handleDeviceOrientation.bind(this));
            }

            async handleFirstTap(event) {
                if (this.permissionRequested) return;
                
                this.permissionRequested = true;
                event.preventDefault();
                event.stopPropagation();
                
                this.updateStatus('Requesting permission...');
                
                try {
                    const permission = await window.DeviceOrientationEvent.requestPermission();
                    this.permissionGranted = permission === 'granted';
                    
                    if (this.permissionGranted) {
                        this.tiltActive = true;
                        this.updateStatus('3D tilt active');
                        this.startTiltEffect();
                        this.heroElement.removeEventListener('touchstart', this.handleFirstTap, { passive: false });
                    } else {
                        this.updateStatus('3D tilt disabled - permission denied');
                    }
                } catch (error) {
                    console.warn('Permission request failed:', error);
                    this.updateStatus('3D tilt disabled - permission error');
                }
            }

            handleDeviceOrientation(event) {
                if (!this.tiltActive) return;

                const beta = event.beta !== null ? Math.max(-45, Math.min(45, event.beta)) : 0;
                const gamma = event.gamma !== null ? Math.max(-45, Math.min(45, event.gamma)) : 0;

                this.tiltValues = { beta, gamma };
            }

            applyTiltTransform() {
                if (!this.tiltActive) return;

                // Smooth interpolation
                this.currentTilt.x += (this.tiltValues.gamma - this.currentTilt.x) * 0.1;
                this.currentTilt.y += (this.tiltValues.beta - this.currentTilt.y) * 0.1;

                // Highly noticeable effect
                const tiltMultiplier = 15;
                const rotateX = this.currentTilt.y * tiltMultiplier;
                const rotateY = this.currentTilt.x * tiltMultiplier;

                // Apply transforms
                const parallaxElement = this.heroElement.querySelector('.hero-parallax');
                const particlesElement = this.heroElement.querySelector('.hero-particles');

                if (parallaxElement) {
                    parallaxElement.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
                }

                if (particlesElement) {
                    particlesElement.style.transform = `rotateX(${rotateX * 0.8}deg) rotateY(${rotateY * 0.8}deg)`;
                }

                this.animationFrame = requestAnimationFrame(this.applyTiltTransform.bind(this));
            }

            startTiltEffect() {
                this.applyTiltTransform();
            }

            updateStatus(message) {
                if (this.statusElement) {
                    this.statusElement.textContent = message;
                }
            }

            cleanup() {
                if (this.animationFrame) {
                    cancelAnimationFrame(this.animationFrame);
                }
                window.removeEventListener('deviceorientation', this.handleDeviceOrientation.bind(this));
            }
        }

        // Initialize the effect when page loads
        document.addEventListener('DOMContentLoaded', () => {
            const tiltEffect = new MobileTiltEffect();
            
            // Cleanup on page unload
            window.addEventListener('beforeunload', () => {
                tiltEffect.cleanup();
            });
        });
    </script>
</body>
</html>
